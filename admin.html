
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | Anfibios Club</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef5f9;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #075985;
            margin-bottom: 20px;
        }

        p {
            color: #52616b;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #0369a1;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
        }

        #panel {
            display: none;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #e0f2fe;
            color: #075985;
        }

        .oculto {
            display: none;
        }
    </style>

</head>

<body>

    <main class="contenedor">

        <!-- INICIO DE SESIÓN -->

        <section id="inicioSesion">

            <h1>Anfibios Club</h1>

            <h2>Panel administrativo</h2>

            <p>
                Ingresa tus credenciales para acceder
                a la información de los estudiantes.
            </p>

            <form id="formularioLogin">

                <div class="campo">

                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="contraseña">Contraseña</label>

                    <input
                        type="password"
                        id="contraseña"
                        required
                    >

                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p id="mensaje"></p>

        </section>


        <!-- PANEL DE ADMINISTRACIÓN -->

        <section id="panel">

            <div class="barra">

                <div>
                    <h1>Panel administrativo</h1>
                    <p>Gestión de estudiantes de Anfibios Club.</p>
                </div>

                <button id="cerrarSesion">
                    Cerrar sesión
                </button>

            </div>

            <h2>Estudiantes inscritos</h2>

            <p id="mensajePanel"></p>

            <div class="tabla-contenedor">

                <table>

                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Fecha de nacimiento</th>
                            <th>Celular</th>
                            <th>Emergencia</th>
                            <th>Nivel</th>
                        </tr>
                    </thead>

                    <tbody id="tablaEstudiantes"></tbody>

                </table>

            </div>

        </section>

    </main>


    <script>

        // IDENTIFICAR ELEMENTOS

        const formularioLogin =
            document.getElementById("formularioLogin");

        const inicioSesion =
            document.getElementById("inicioSesion");

        const panel =
            document.getElementById("panel");

        const mensaje =
            document.getElementById("mensaje");

        const tablaEstudiantes =
            document.getElementById("tablaEstudiantes");


        // INICIAR SESIÓN

        formularioLogin.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const usuario =
                    document.getElementById("usuario").value.trim();

                const contraseña =
                    document.getElementById("contraseña").value;

                try {

                    const respuesta = await fetch(
                        "http://localhost:3000/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                usuario,
                                contraseña
                            })
                        }
                    );

                    const datos = await respuesta.json();

                    if (!respuesta.ok) {
                        throw new Error(datos.mensaje);
                    }

                    // Guardar el token durante la sesión de la pestaña
                    sessionStorage.setItem("tokenAdmin", datos.token);

                    // Mostrar el panel
                    inicioSesion.style.display = "none";
                    panel.style.display = "block";

                    // Consultar estudiantes
                    cargarEstudiantes();

                } catch (error) {

                    mensaje.textContent = error.message;

                }

            }
        );


        // CONSULTAR ESTUDIANTES PRIVADOS

        async function cargarEstudiantes() {

            const token =
                sessionStorage.getItem("tokenAdmin");

            try {

                const respuesta = await fetch(
                    "http://localhost:3000/api/admin/estudiantes",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(datos.mensaje);
                }

                tablaEstudiantes.innerHTML = "";

                if (datos.estudiantes.length === 0) {

                    document.getElementById("mensajePanel")
                        .textContent = "Todavía no hay estudiantes inscritos.";

                    return;

                }

                document.getElementById("mensajePanel")
                    .textContent = "Estudiantes registrados: " +
                    datos.estudiantes.length;

                datos.estudiantes.forEach(function(estudiante) {

                    const fila = document.createElement("tr");

                    const valores = [
                        estudiante.nombre,
                        estudiante.fecha_nacimiento,
                        estudiante.celular,
                        estudiante.emergencia,
                        estudiante.nivel
                    ];

                    valores.forEach(function(valor) {

                        const celda = document.createElement("td");

                        celda.textContent = valor;

                        fila.appendChild(celda);

                    });

                    tablaEstudiantes.appendChild(fila);

                });

            } catch (error) {

                document.getElementById("mensajePanel")
                    .textContent = error.message;

            }

        }


        // CERRAR SESIÓN

        document.getElementById("cerrarSesion")
            .addEventListener("click", function() {

                sessionStorage.removeItem("tokenAdmin");

                panel.style.display = "none";
                inicioSesion.style.display = "block";

                formularioLogin.reset();

                mensaje.textContent = "";

            });

    </script>

</body>

</html>
