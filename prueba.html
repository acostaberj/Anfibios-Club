
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Backend - Anfibios Club</title>
</head>
<body>

    <h1>Prueba de inscripción</h1>

    <button id="enviar">Enviar estudiante</button>

    <p id="resultado"></p>

    <script>
        const boton = document.getElementById("enviar");
        const resultado = document.getElementById("resultado");

        boton.addEventListener("click", function() {

            fetch("http://localhost:3000/api/estudiantes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nombre: "Pedro",
                    fechaNacimiento: "2006-10-12",
                    nivel: "Básico"
                })
            })
            .then(function(respuesta) {
                return respuesta.json();
            })
            .then(function(datos) {
                resultado.textContent = datos.mensaje;
                console.log(datos);
            })
            .catch(function(error) {
                console.log("Error:", error);
            });

        });
    </script>

</body>
</html>
